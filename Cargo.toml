# Location: Cargo.toml
# Function: Pure Rust crate manifest for the Dopamine native desktop client,
# providing the eframe/egui presentation layer, Symphonia decoder, and Hi-Fi DSP.
# All Rights Reserved isgaar

[package]
name = "dopamine_desktop"
version = "2.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Pure Rust native desktop client for Dopamine Core"
default-run = "dopamine"

[lib]
name = "dopamine_desktop"
path = "src/lib.rs"

[[bin]]
name = "dopamine"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.31"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.5", features = ["flac", "mp3", "pcm", "wav", "ogg", "vorbis", "aac", "isomp4", "alac", "adpcm"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
url = "2"
raw-window-handle = "0.6"
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-protocols-plasma = { version = "0.3", features = ["client"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

