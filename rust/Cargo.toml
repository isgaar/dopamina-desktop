# Location: rust/Cargo.toml
# Function: Rust core crate manifest for the Dopamine desktop client.
# All Rights Reserved isgaar

[package]
name = "dopamine_desktop"
version = "2.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Rust core for the Dopamine native desktop client"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
cxx = "1.0.176"
cxx-qt = "0.10"
cxx-qt-lib = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "rt", "time"] }
url = "2"

[build-dependencies]
cxx-qt-build = { version = "0.10", features = ["link_qt_object_files"] }
